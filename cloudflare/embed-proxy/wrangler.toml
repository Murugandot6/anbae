name = "embed-proxy"
main = "src/index.js"
compatibility_date = "2024-10-01"
# Region rotation 2026-11-04: SIN colo was getting CF-challenged upstream for
# several providers (vidfast/vidup/vixsrc/multiembed); try EU first.
regions = ["WEUR"]

# Deploy:  npx wrangler deploy
# Serves:  https://embed-proxy.<your-subdomain>.workers.dev/{provider}/{path}
#
# Route shape: /{provider}/{...upstreamPath}?{query}
# e.g. /vidsrc/embed/movie/550  ->  https://vidsrc.su/embed/movie/550
#      with ad machinery stripped per the REA static-analysis evidence.
